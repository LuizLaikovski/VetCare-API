services:
  database:
    image: postgres:15-alpine
    container_name: vetcare-db
    environment:
      POSTGRES_DB: vetcare_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vetcare_app"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: vetcare-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  api:
    build: .
    container_name: container-vetcare
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://database:5432/vetcare_app
      - DB_ARQ_URL=jdbc:postgresql://database:5432/vetcare_arq
      - DB_USER=postgres
      - DB_PASSWORD=password
      - JWT_SECRET=change_me_to_a_very_secure_random_key_123456
    depends_on:
      database:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
