spring.application.name=petmeds-api

# JWT Configuration
api.security.token.secret=change_me_to_a_very_secure_random_key_123456

# DataSource Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# Flyway Configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.ignore-migration-checksums=true
spring.flyway.validate-on-migrate=false

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Senhas do Spring Security
spring.security.user.name=admin
spring.security.user.password=123456


logging.level.org.springframework.security=INFO


# Faz com que o DispatcherServlet lance uma exceção em vez de retornar 404 padrão
spring.mvc.throw-exception-if-no-handler-found=true

# Desativa o mapeamento padrão de recursos estáticos para garantir que a exceção seja capturada
spring.web.resources.add-mappings=false

# Logs
logging.level.comvetcare.petmeds=INFO

# Swagger
springdoc.swagger-ui.path=/doc